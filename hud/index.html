<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>kiTT — HUD</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;               /* le canvas gère le tactile */
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #ffe9fb;
  }
  :root {
    --neon-pink: #ff2d95;
    --neon-cyan: #24e5ff;
  }
  #scene { position: fixed; inset: 0; }

  /* Vignette : assombrit légèrement les bords pour la lisibilité du texte. */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      linear-gradient(to top, rgba(3,0,10,.55), transparent 28%),
      linear-gradient(to bottom, rgba(3,0,10,.4), transparent 18%);
  }

  #hud-top {
    position: fixed; top: 16px; left: 0; right: 0;
    text-align: center;
    letter-spacing: .45em; font-size: 13px; font-weight: 300;
    text-transform: uppercase;
    color: #ffe9fb;
    text-shadow: 0 0 6px #ff2d95, 0 0 18px #ff2d95, 0 0 3px #24e5ff;
    pointer-events: none; z-index: 10;
  }
  #status {
    position: fixed; bottom: 8px; right: 14px;
    color: rgba(255,255,255,.35);
    font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
    pointer-events: none; transition: opacity 1s; z-index: 10;
  }

  /* ---------- Dock : raccourcis de sections ---------- */
  #dock {
    position: fixed; left: 14px; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 10px;
    z-index: 20;
  }
  #clock {
    text-align: center; color: rgba(255,233,251,.75);
    font-size: 12px; letter-spacing: .18em;
    margin-bottom: 2px;
  }
  #dock button {
    width: 56px; height: 56px;
    border: 1px solid rgba(255,45,149,.3);
    border-radius: 14px;
    background: rgba(16,4,34,.45);
    color: rgba(255,233,251,.8);
    font: inherit; font-size: 9px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color .2s, box-shadow .2s, transform .1s;
  }
  #dock button .ic { font-size: 19px; line-height: 1; }
  #dock button:active { transform: scale(.93); }
  #dock button.on {
    border-color: var(--neon-cyan);
    color: #fff;
    box-shadow: 0 0 10px rgba(36,229,255,.35), 0 0 22px rgba(36,229,255,.18);
  }
  #pager {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    margin-top: 6px;
  }
  #pager i {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,233,251,.25);
    transition: background .3s, box-shadow .3s;
  }
  #pager i.on { background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }

  /* ---------- Sections : couches HUD sans fenêtres ---------- */
  .sec {
    position: fixed; inset: 0;
    pointer-events: none;             /* la scène reste orientable partout… */
    opacity: 0; transform: translateY(18px);
    transition: opacity .45s ease, transform .45s ease;
    z-index: 10;
  }
  .sec.on { opacity: 1; transform: none; }
  .sec button, .sec .touch { pointer-events: auto; }   /* …sauf sur les contrôles */

  .label {
    font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(255,233,251,.55);
  }
  .huge {
    font-weight: 200; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 14px rgba(36,229,255,.75);
  }

  /* --- Section kiTT (dashboard) --- */
  #sec-car .speed {
    position: absolute; left: 100px; bottom: 44px;
  }
  #sec-car .speed .huge { font-size: 96px; }
  #sec-car .rpmzone {
    position: absolute; right: 36px; bottom: 44px; text-align: right;
  }
  #sec-car .rpmzone .huge { font-size: 44px; text-shadow: 0 0 12px rgba(255,45,149,.75); }
  #carRpmBar {
    width: 240px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,.08);
    overflow: hidden; margin-top: 10px; margin-left: auto;
  }
  #carRpmFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink) 78%, #ff3b3b);
    box-shadow: 0 0 10px rgba(255,45,149,.6);
    transition: width .12s linear;
  }
  #sec-car .minis {
    position: absolute; right: 36px; top: 72px; text-align: right;
    display: flex; flex-direction: column; gap: 14px;
  }
  #sec-car .minis .v { font-size: 22px; font-variant-numeric: tabular-nums; }
  #sec-car .minis .warn { color: #ff6b6b; text-shadow: 0 0 10px rgba(255,59,59,.8); }

  /* --- Section Nav --- */
  #sec-nav .banner {
    position: absolute; top: 60px; left: 0; right: 0; text-align: center;
  }
  #sec-nav .banner .huge { font-size: 34px; text-shadow: 0 0 14px rgba(36,229,255,.7); }
  #sec-nav .eta {
    position: absolute; bottom: 44px; left: 0; right: 0; text-align: center;
    font-size: 22px; font-weight: 300;
  }
  #sec-nav .eta b { color: var(--neon-cyan); font-weight: 600; }
  /* Recherche d'adresse */
  #sec-nav .search {
    position: absolute; left: 100px; top: 110px; width: min(34%, 340px);
  }
  #navQ {
    width: 100%; box-sizing: border-box;
    background: rgba(16,4,34,.6);
    border: 1px solid rgba(255,45,149,.35);
    border-radius: 12px;
    color: #fff; font: inherit; font-size: 16px;
    padding: 12px 16px; outline: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    caret-color: var(--neon-cyan);
  }
  #navQ:focus, #navQ.on { border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(36,229,255,.3); }
  #navResults { display: flex; flex-direction: column; margin-top: 8px; }
  #navResults button {
    background: rgba(16,4,34,.55); border: none;
    border-bottom: 1px solid rgba(255,45,149,.15);
    color: rgba(255,233,251,.85); text-align: left;
    font: inherit; font-size: 14px; line-height: 1.35;
    padding: 11px 14px; cursor: pointer;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #navResults button:first-child { border-radius: 12px 12px 0 0; }
  #navResults button:last-child { border-radius: 0 0 12px 12px; border-bottom: none; }
  #navResults button:active { color: #fff; background: rgba(36,229,255,.15); }
  #navResults button small { display: block; font-size: 11px; color: rgba(255,233,251,.45); }

  /* Clavier tactile partagé : grosses touches, bas d'écran */
  #kbd {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 60;
    display: flex; flex-direction: column; gap: 7px;
    padding: 12px;
    background: rgba(10,2,24,.72);
    border: 1px solid rgba(255,45,149,.3);
    border-radius: 18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  #kbd[hidden] { display: none; }
  #kbd .row { display: flex; gap: 7px; justify-content: center; }
  #kbd button {
    min-width: 52px; height: 52px;
    border: none; border-radius: 10px;
    background: rgba(255,255,255,.07);
    color: #ffe9fb; font: inherit; font-size: 19px;
    cursor: pointer;
    transition: background .1s, transform .05s;
  }
  #kbd button:active { background: rgba(36,229,255,.3); transform: scale(.94); }
  #kbd button.wide { min-width: 84px; font-size: 14px; }
  #kbd button.space { min-width: 220px; }
  #kbd button.go {
    background: rgba(36,229,255,.18);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 10px rgba(36,229,255,.25);
  }

  /* --- Section Audio --- */
  #sec-audio .now {
    position: absolute; bottom: 44px; left: 0; right: 0; text-align: center;
  }
  #trackTitle { font-size: 42px; font-weight: 200; text-shadow: 0 0 14px rgba(255,45,149,.7); }
  #trackArtist { font-size: 13px; letter-spacing: .35em; text-transform: uppercase; color: rgba(255,233,251,.6); margin-top: 6px; }
  #audioProg {
    width: min(46%, 420px); margin: 18px auto 0;
    display: flex; align-items: center; gap: 12px;
    font-size: 11px; color: rgba(255,233,251,.6);
    font-variant-numeric: tabular-nums;
  }
  #audioBar { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; }
  #audioFill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); }
  #audioCtl { display: flex; gap: 26px; justify-content: center; margin-top: 14px; }
  #audioCtl button {
    background: none; border: none; color: #ffe9fb;
    font-size: 26px; cursor: pointer;
    text-shadow: 0 0 10px rgba(36,229,255,.5);
  }
  #audioCtl button:active { transform: scale(.9); }
  #sec-audio .playlist {
    position: absolute; left: 100px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 6px;
  }
  #sec-audio .playlist button {
    background: none; border: none; text-align: left;
    color: rgba(255,233,251,.5);
    font: inherit; font-size: 17px; font-weight: 300;
    padding: 5px 0; cursor: pointer;
  }
  #sec-audio .playlist button.on { color: #fff; text-shadow: 0 0 10px var(--neon-pink); }

  /* --- Section OBD --- */
  #sec-obd .rpmbig {
    position: absolute; left: 100px; bottom: 44px;
  }
  #sec-obd .rpmbig .huge { font-size: 74px; text-shadow: 0 0 14px rgba(255,45,149,.75); }
  #sec-obd .grid {
    position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 20px; text-align: right;
  }
  #sec-obd .grid .v { font-size: 32px; font-weight: 200; font-variant-numeric: tabular-nums; }
  #sec-obd .grid .warn .v { color: #ff6b6b; text-shadow: 0 0 12px rgba(255,59,59,.8); }
  #sec-obd .sparkzone {
    position: absolute; left: 100px; bottom: 150px; width: min(38%, 420px);
  }
  #spark { width: 100%; height: 64px; display: block; }
  #obdAlert {
    position: absolute; top: 60px; left: 0; right: 0; text-align: center;
    font-size: 20px; color: #ff6b6b; text-shadow: 0 0 12px rgba(255,59,59,.8);
    letter-spacing: .1em;
  }

  /* ---------- Toasts : erreurs & infos, coin haut droit ---------- */
  #toasts {
    position: fixed; top: 52px; right: 16px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 100;
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    display: flex; gap: 11px; align-items: baseline;
    max-width: 320px;
    padding: 11px 15px;
    border-radius: 12px;
    background: rgba(28, 4, 20, .78);
    border: 1px solid rgba(255, 59, 59, .5);
    box-shadow: 0 0 16px rgba(255, 59, 59, .18), 0 6px 24px rgba(0,0,0,.5);
    color: #ffdbe4;
    font-size: 12.5px; line-height: 1.4;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    cursor: pointer;
    animation: toastIn .3s ease-out;
    transition: opacity .4s, transform .4s;
  }
  .toast .ic { font-size: 15px; text-shadow: 0 0 8px rgba(255,59,59,.9); }
  .toast b { display: block; font-weight: 600; letter-spacing: .04em; }
  .toast small { color: rgba(255,219,228,.55); font-size: 11px; }
  .toast.info {
    border-color: rgba(36, 229, 255, .45);
    box-shadow: 0 0 16px rgba(36, 229, 255, .15), 0 6px 24px rgba(0,0,0,.5);
    background: rgba(6, 16, 30, .78);
    color: #dcf7ff;
  }
  .toast.info .ic { text-shadow: 0 0 8px rgba(36,229,255,.9); }
  .toast.info small { color: rgba(220,247,255,.5); }
  .toast.out { opacity: 0; transform: translateX(14px); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(14px); } }

  /* ---------- Assistant kiTT (swipe vers le haut) ---------- */
  #assist {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 26px; gap: 14px;
    background: linear-gradient(to top,
      rgba(5,1,15,.94) 0%, rgba(5,1,15,.6) 40%, transparent 72%);
    opacity: 0; transform: translateY(36px);
    transition: opacity .4s ease, transform .4s ease;
    pointer-events: none;
  }
  #assist.on { opacity: 1; transform: none; }
  /* Clavier ouvert : on remonte le contenu au-dessus des touches. */
  #assist.kbd { padding-bottom: 300px; }
  #assist.kbd #orb { width: 74px; height: 74px; }
  #assist.on input, #assist.on button { pointer-events: auto; }
  #assistUser {
    font-size: 14px; color: rgba(255,233,251,.55);
    letter-spacing: .05em; min-height: 18px;
  }
  #assistReply {
    font-size: 26px; font-weight: 200; text-align: center;
    max-width: min(70%, 640px); line-height: 1.35;
    text-shadow: 0 0 12px rgba(36,229,255,.5);
    min-height: 36px;
  }
  #orb { width: 108px; height: 108px; }
  #assistRow { display: flex; gap: 10px; align-items: center; width: min(46%, 400px); }
  #assistQ {
    flex: 1; box-sizing: border-box;
    background: rgba(16,4,34,.65);
    border: 1px solid rgba(36,229,255,.4);
    border-radius: 12px;
    color: #fff; font: inherit; font-size: 16px;
    padding: 12px 16px; outline: none;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #assistMic {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(16,4,34,.65);
    border: 1px solid rgba(255,45,149,.4);
    color: #ffe9fb; font-size: 18px; cursor: pointer;
  }
  #assistMic.rec {
    border-color: #ff3b3b;
    box-shadow: 0 0 14px rgba(255,59,59,.5);
    animation: micPulse 1.1s ease-in-out infinite;
  }
  @keyframes micPulse { 50% { box-shadow: 0 0 26px rgba(255,59,59,.8); } }
  #assistHint {
    font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
    color: rgba(255,233,251,.3);
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="vignette"></div>
<div id="hud-top">Audi &nbsp;kiTT</div>
<div id="status">chargement du modèle…</div>
<div id="toasts"></div>

<!-- Dock : raccourcis vers les sections (scroll / swipe fait pareil) -->
<nav id="dock">
  <div id="clock">--:--</div>
  <button data-sec="car" class="on"><span class="ic">🏁</span>kiTT</button>
  <button data-sec="nav"><span class="ic">🧭</span>Nav</button>
  <button data-sec="audio"><span class="ic">🎵</span>Audio</button>
  <button data-sec="obd"><span class="ic">📊</span>OBD</button>
  <div id="pager"><i class="on"></i><i></i><i></i><i></i></div>
</nav>

<!-- ===== Section kiTT : dashboard ===== -->
<section class="sec on" id="sec-car">
  <div class="speed">
    <div class="label">Vitesse</div>
    <div class="huge"><span id="carSpeed">0</span></div>
    <div class="label">km/h</div>
  </div>
  <div class="rpmzone">
    <div class="label">Régime</div>
    <div class="huge" id="carRpm">850</div>
    <div id="carRpmBar"><div id="carRpmFill"></div></div>
  </div>
  <div class="minis">
    <div><div class="label">Temp. eau</div><div class="v" id="carTemp">--°</div></div>
    <div><div class="label">Carburant</div><div class="v" id="carFuel">--%</div></div>
  </div>
</section>

<!-- ===== Section Nav : la scène EST la carte (ville OSM + itinéraire au sol) ===== -->
<section class="sec" id="sec-nav">
  <div class="banner">
    <div class="huge" id="navBanner">chargement de la carte…</div>
  </div>
  <div class="search touch">
    <input id="navQ" type="text" placeholder="🔍 Rechercher une adresse…" readonly>
    <div id="navResults"></div>
  </div>
  <div class="eta" id="navEta">—</div>
</section>

<!-- Clavier tactile partagé (recherche Nav, assistant kiTT) -->
<div id="kbd" hidden><!-- rempli par le script --></div>

<!-- ===== Assistant kiTT : swipe vers le haut ===== -->
<div id="assist">
  <div id="assistUser"></div>
  <div id="assistReply">Comment puis-je aider ?</div>
  <canvas id="orb" width="150" height="150"></canvas>
  <div id="assistRow">
    <input id="assistQ" type="text" placeholder="Parle à kiTT…" readonly>
    <button id="assistMic" title="reconnaissance vocale">🎤</button>
  </div>
  <div id="assistHint">balaye vers le bas pour fermer</div>
</div>

<!-- ===== Section Audio ===== -->
<section class="sec" id="sec-audio">
  <div class="playlist">
    <div class="label" style="margin-bottom:8px">Playlist — Night Drive</div>
    <!-- remplie par le script -->
  </div>
  <div class="now">
    <div id="trackTitle">—</div>
    <div id="trackArtist">—</div>
    <div id="audioProg">
      <span id="tCur">0:00</span>
      <div id="audioBar"><div id="audioFill"></div></div>
      <span id="tEnd">0:00</span>
    </div>
    <div id="audioCtl">
      <button id="btnPrev">⏮</button>
      <button id="btnPlay">▶</button>
      <button id="btnNext">⏭</button>
    </div>
  </div>
</section>

<!-- ===== Section OBD : diagnostic en grand ===== -->
<section class="sec" id="sec-obd">
  <div id="obdAlert"></div>
  <div class="sparkzone">
    <div class="label">Vitesse — 60 s</div>
    <canvas id="spark"></canvas>
  </div>
  <div class="rpmbig">
    <div class="label">Régime moteur</div>
    <div class="huge" id="obdRpm">—</div>
    <div class="label">tr/min</div>
  </div>
  <div class="grid">
    <div><div class="label">Temp. eau</div><div class="v" id="oTemp">—</div></div>
    <div><div class="label">Carburant</div><div class="v" id="oFuel">—</div></div>
    <div><div class="label">Batterie</div><div class="v" id="oVolt">—</div></div>
    <div><div class="label">Turbo</div><div class="v" id="oBoost">—</div></div>
  </div>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls }   from "three/addons/controls/OrbitControls.js";
import { GLTFLoader }      from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { mergeVertices, mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { EffectComposer }  from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass }      from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass }      from "three/addons/postprocessing/OutputPass.js";

// Réglages rapides via l'URL :
//   ?mode=synth  → néon synthwave (défaut) : contours cyan/rose + grille + bloom
//   ?mode=real   → rendu réaliste (peinture noire satinée)
//   ?mode=wire   → silhouette hologramme blanche
//   ?mode=edges  → wireframe par arêtes (+ ?edges=25 : seuil en degrés)
//   ?cut=0.5&soft=0.22 → seuil/douceur du trait (synth et wire)
//   ?bloom=0.8   → intensité du glow (synth)
//   ?model=v3|v4|v5
const params = new URLSearchParams(location.search);
const MODE  = params.get("mode") || "synth";
const SYNTH = MODE === "synth";
const REAL  = MODE === "real";
const EDGE_THRESHOLD = Number(params.get("edges")) || 18;
const CUT   = Number(params.get("cut"))   || (SYNTH ? 0.66 : 0.5);
const SOFT  = Number(params.get("soft"))  || (SYNTH ? 0.14 : 0.22);
const BLOOM = Number(params.get("bloom")) || 0.55;

// Palette néon
const NEON_PINK = new THREE.Color(0xff2d95);
const NEON_CYAN = new THREE.Color(0x24e5ff);

const MODELS = {
  v3: "assets/tt_mk2_v3.glb",     // text-to-3D refine (silhouette approximative)
  v4: "assets/tt_mk2_v4.glb",     // multi-image-to-3D depuis les photos de la vraie mk2
  v5: "assets/tt_mk2_v5.glb",     // v4 remeshé en quads 300k (surface lissée)
};
const pick = params.get("model");
const modelChain = pick ? [MODELS[pick], MODELS.v5, MODELS.v4, MODELS.v3]
                        : [MODELS.v5, MODELS.v4, MODELS.v3];

const statusEl = document.getElementById("status");

// ---------- Rendu ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById("scene").appendChild(renderer.domElement);

const scene = new THREE.Scene();

if (SYNTH) {
  // Ciel de nuit rétro : dégradé indigo → magenta sombre à l'horizon.
  const c = document.createElement("canvas");
  c.width = 2; c.height = 256;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, "#05010f");
  grad.addColorStop(0.55, "#0d0322");
  grad.addColorStop(0.8, "#2a0a3f");
  grad.addColorStop(1.0, "#4a1345");
  g.fillStyle = grad;
  g.fillRect(0, 0, 2, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
} else {
  scene.background = new THREE.Color(0x000000);
}

if (REAL) {
  // Environnement studio : donne les reflets sur la carrosserie.
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

  const key = new THREE.DirectionalLight(0xffffff, 1.6);
  key.position.set(4, 6, 3);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xdde4f0, 0.3);
  rim.position.set(-5, 3, -4);
  scene.add(rim);
  scene.add(new THREE.AmbientLight(0xffffff, 0.15));
}

// Caméra orthographique => vraie vue isométrique (pas de fuyantes).
const ISO_ELEV = 0.42;                           // radians (~24°)
let frustum = SYNTH ? 3.1 : 2.7;
const camera = new THREE.OrthographicCamera();
function sizeCamera() {
  const a = innerWidth / innerHeight;
  camera.left = -frustum * a; camera.right = frustum * a;
  camera.top  =  frustum;     camera.bottom = -frustum;
  camera.near = -100; camera.far = 100;
  camera.updateProjectionMatrix();
}
sizeCamera();
camera.position.setFromSphericalCoords(10, Math.PI / 2 - ISO_ELEV, Math.PI / 4);
camera.lookAt(0, 0, 0);

// ---------- Post-traitement : bloom néon ----------
let composer = null;
if (SYNTH) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), BLOOM, 0.4, 0.4));
  composer.addPass(new OutputPass());
}

// ---------- Contrôles tactiles + auto-rotation ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.enableZoom = false;           // la molette sert à changer de section
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minPolarAngle = 0.28;         // assez haut pour la vue "carte" (Nav)…
controls.maxPolarAngle = 1.45;         // …jusqu'au quasi-profil

// Un doigt sur l'écran stoppe la rotation ; elle reprend 3 s après.
let resumeTimer = null;
controls.addEventListener("start", () => {
  controls.autoRotate = false;
  clearTimeout(resumeTimer);
});
controls.addEventListener("end", () => {
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => { controls.autoRotate = true; }, 3000);
});

// ---------- Vols de caméra : transitions entre sections ----------
// Chaque section cadre la voiture sous son angle : le dashboard en iso,
// la Nav en plongée (la scène devient la carte), l'Audio en profil,
// l'OBD sur la face avant (le moteur).
// `car` = facteur d'échelle de la voiture : en Nav elle rétrécit façon
// marqueur GPS pendant que la caméra dé-zoome sur la ville OSM.
const VIEWS = {
  car:   { theta: Math.PI / 4,           phi: Math.PI / 2 - ISO_ELEV, zoom: 1.0,  car: 1.0,  rotate: true  },
  nav:   { theta: 0.0,                   phi: 0.3,  zoom: 0.16, car: 0.34, rotate: false },
  audio: { theta: 0.06,                  phi: 1.32, zoom: 1.22, car: 1.0,  rotate: false },
  obd:   { theta: Math.PI / 4 + Math.PI, phi: 1.22, zoom: 1.12, car: 1.0,  rotate: false },
  // Face à face avec la voiture : la vue de l'assistant vocal.
  assistant: { theta: Math.PI / 4 + Math.PI, phi: 1.28, zoom: 1.45, car: 1.0, rotate: false },
};
let flight = null;
let carFactorTarget = 1.0;
let carFactor = 1.0;
const _sph = new THREE.Spherical();

window.__kittFly = (name) => {
  const v = VIEWS[name] || VIEWS.car;
  flight = { ...v };
  carFactorTarget = v.car;
  controls.autoRotate = false;
  clearTimeout(resumeTimer);
};
controls.addEventListener("start", () => { flight = null; });

const wrapAngle = (a) => ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;

function stepFlight(dt) {
  const k = 1 - Math.exp(-4.5 * dt);               // glissement exponentiel, sans à-coups
  // L'échelle de la voiture se lisse en permanence (même hors vol).
  carFactor += (carFactorTarget - carFactor) * k;
  carRig.scale.setScalar(carFactor);
  if (!flight) return;
  _sph.setFromVector3(camera.position);
  const dTheta = wrapAngle(flight.theta - _sph.theta);
  const dPhi   = flight.phi  - _sph.phi;
  const dZoom  = flight.zoom - camera.zoom;
  _sph.theta += dTheta * k;
  _sph.phi   += dPhi * k;
  _sph.radius = 10;
  camera.position.setFromSpherical(_sph);
  camera.lookAt(0, 0, 0);
  camera.zoom += dZoom * k;
  camera.updateProjectionMatrix();
  if (Math.abs(dTheta) < 0.01 && Math.abs(dPhi) < 0.01 && Math.abs(dZoom) < 0.01) {
    if (flight.rotate) controls.autoRotate = true;   // l'iso par défaut re-tourne
    flight = null;
  }
}

// ---------- Sol ----------
function circlePoints(radius, y = 0, segments = 128) {
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const t = (i / segments) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(t) * radius, y, Math.sin(t) * radius));
  }
  return pts;
}

if (SYNTH) {
  // Grille polaire néon : anneaux concentriques + rayons magenta.
  const grid = new THREE.Group();
  for (let r = 1.4; r <= 6.5; r += 0.85) {
    const fade = Math.max(0.06, 0.55 - (r - 1.4) * 0.09);
    const geo = new THREE.BufferGeometry().setFromPoints(circlePoints(r));
    grid.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: NEON_PINK, transparent: true, opacity: fade })));
  }
  const spokes = [];
  for (let i = 0; i < 24; i++) {
    const t = (i / 24) * Math.PI * 2;
    spokes.push(new THREE.Vector3(Math.cos(t) * 1.4, 0, Math.sin(t) * 1.4));
    spokes.push(new THREE.Vector3(Math.cos(t) * 6.5, 0, Math.sin(t) * 6.5));
  }
  const spokeGeo = new THREE.BufferGeometry().setFromPoints(spokes);
  grid.add(new THREE.LineSegments(spokeGeo, new THREE.LineBasicMaterial({
    color: NEON_PINK, transparent: true, opacity: 0.22 })));
  grid.position.y = -0.01;
  scene.add(grid);
} else {
  const mk = (r, o) => new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(circlePoints(r)),
    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: o }));
  scene.add(mk(2.6, 0.18), mk(2.75, 0.07));
}

// ---------- Ville OSM : la scène devient la carte en section Nav ----------
// Les données viennent d'Overpass via le proxy /osm de serve.py :
// bâtiments extrudés (masse sombre + arêtes néon) et routes au sol,
// fusionnés en géométries uniques pour tenir le budget de rendu.
// Échelle : 1 unité scène = 8 m réels (la TT fait ~4 unités → le facteur
// `car` de la vue Nav la réduit en marqueur GPS).
const M_PER_UNIT = 8;
const mapGroup = new THREE.Group();
mapGroup.visible = false;
scene.add(mapGroup);

const routeGroup = new THREE.Group();   // itinéraire par-dessus la ville
scene.add(routeGroup);
let routeTarget = 0;                    // opacité cible (1 en section Nav)

let mapCenter = null;                   // {lat, lon} du centre chargé
function toLocal(lat, lon) {
  const kx = 111320 * Math.cos(mapCenter.lat * Math.PI / 180) / M_PER_UNIT;
  const kz = 110540 / M_PER_UNIT;
  return [ (lon - mapCenter.lon) * kx, -(lat - mapCenter.lat) * kz ];
}

function buildCity(osm) {
  // Nettoie un éventuel chargement précédent.
  while (mapGroup.children.length) mapGroup.remove(mapGroup.children[0]);

  const buildingGeos = [];
  const majorPts = [], minorPts = [];
  const MAJOR = /^(motorway|trunk|primary|secondary|tertiary)/;

  for (const el of osm.elements ?? []) {
    if (el.type !== "way" || !el.geometry) continue;
    const tags = el.tags ?? {};

    if (tags.building) {
      const pts = el.geometry.map(g => toLocal(g.lat, g.lon));
      if (pts.length < 3) continue;
      const shape = new THREE.Shape();
      shape.moveTo(pts[0][0], -pts[0][1]);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], -pts[i][1]);
      const h = (parseFloat(tags.height) || (parseFloat(tags["building:levels"]) || 3) * 3) / M_PER_UNIT;
      try {
        const geo = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
        geo.rotateX(-Math.PI / 2);      // XY du plan -> sol XZ, profondeur -> hauteur Y
        buildingGeos.push(geo);
      } catch { /* footprint dégénéré : on ignore */ }
    } else if (tags.highway) {
      const bucket = MAJOR.test(tags.highway) ? majorPts : minorPts;
      const pts = el.geometry.map(g => toLocal(g.lat, g.lon));
      for (let i = 1; i < pts.length; i++) {
        bucket.push(new THREE.Vector3(pts[i-1][0], 0.02, pts[i-1][1]),
                    new THREE.Vector3(pts[i][0],   0.02, pts[i][1]));
      }
    }
  }

  // Bâtiments : une seule masse sombre + un seul paquet d'arêtes néon.
  if (buildingGeos.length) {
    const merged = mergeGeometries(buildingGeos, false);
    mapGroup.add(new THREE.Mesh(merged, new THREE.MeshBasicMaterial({
      color: 0x0d0322,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 })));
    const edges = mergeGeometries(buildingGeos.map(g => new THREE.EdgesGeometry(g, 30)), false);
    mapGroup.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({
      color: NEON_PINK, transparent: true, opacity: 0.35 })));
    buildingGeos.forEach(g => g.dispose());
  }
  const mkRoads = (pts, color, opacity) => {
    if (!pts.length) return;
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    mapGroup.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color, transparent: true, opacity })));
  };
  mkRoads(majorPts, NEON_CYAN, 0.5);
  mkRoads(minorPts, 0xffffff, 0.14);
}

window.__kittMap = {
  async load(lat, lon, r = 600) {
    mapCenter = { lat, lon };
    const res = await fetch(`/osm?lat=${lat}&lon=${lon}&r=${r}`);
    const osm = await res.json();
    if (osm.error) throw new Error(osm.error);
    buildCity(osm);
    return osm.elements?.length ?? 0;
  },
  toLocal: (lat, lon) => toLocal(lat, lon),
  center: () => mapCenter,
  setRoute(coords) {                    // coords = [[lon, lat], ...] (GeoJSON OSRM)
    while (routeGroup.children.length) routeGroup.remove(routeGroup.children[0]);
    if (!coords?.length) return;
    const pts = coords.map(([lon, lat]) => {
      const [x, z] = toLocal(lat, lon);
      return new THREE.Vector3(x, 0.05, z);
    });
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: NEON_CYAN, transparent: true, opacity: 0 }));
    line.userData.max = 0.95;
    const ring = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(circlePoints(1.2, 0, 48)),
      new THREE.LineBasicMaterial({ color: NEON_CYAN, transparent: true, opacity: 0 }));
    ring.position.copy(pts[pts.length - 1]);
    ring.userData.max = 0.7;
    routeGroup.add(line, ring);
  },
  show(visible) {
    mapGroup.visible = visible;
    routeTarget = visible ? 1 : 0;
  },
};

function stepRoute(dt) {
  const k = 1 - Math.exp(-6 * dt);
  for (const child of routeGroup.children) {
    const m = child.material;
    m.opacity += ((child.userData.max ?? 0.85) * routeTarget - m.opacity) * k;
  }
}

// ---------- Voiture ----------
// carRig = enveloppe d'échelle (marqueur GPS en Nav) ; carGroup = le modèle.
const carRig = new THREE.Group();
const carGroup = new THREE.Group();
carRig.add(carGroup);
scene.add(carRig);

const edgeMat = new THREE.LineBasicMaterial({
  color: 0xffffff, transparent: true, opacity: 0.9,
});
const hullMat = new THREE.MeshBasicMaterial({
  color: SYNTH ? 0x0a0316 : 0x000000,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
});

// Silhouette : luminosité ∝ angle surface/caméra, seuillée en trait net.
// En mode synth, le trait est un dégradé vertical cyan (haut) → rose (bas).
const rimMat = new THREE.ShaderMaterial({
  uniforms: {
    uCut:    { value: CUT },
    uSoft:   { value: SOFT },
    uSynth:  { value: SYNTH ? 1.0 : 0.0 },
    uPink:   { value: NEON_PINK },
    uCyan:   { value: NEON_CYAN },
    uMinY:   { value: 0.0 },
    uMaxY:   { value: 1.0 },
    uPulse:  { value: 0.0 },   // 0..1 : la carrosserie "parle" (assistant kiTT)
  },
  vertexShader: /* glsl */`
    varying vec3 vNormal;
    varying float vY;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vY = (modelMatrix * vec4(position, 1.0)).y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform float uCut;
    uniform float uSoft;
    uniform float uSynth;
    uniform vec3  uPink;
    uniform vec3  uCyan;
    uniform float uMinY;
    uniform float uMaxY;
    varying vec3 vNormal;
    varying float vY;
    uniform float uPulse;
    void main() {
      float f = 1.0 - abs(normalize(vNormal).z);
      // La pulsation abaisse le seuil : le trait s'élargit quand kiTT parle.
      float cut = uCut - uPulse * 0.28;
      float line = smoothstep(cut, cut + uSoft, f);
      float h = clamp((vY - uMinY) / (uMaxY - uMinY), 0.0, 1.0);
      vec3 white = vec3(1.0);
      vec3 neon  = mix(uPink, uCyan, h);
      vec3 col   = mix(white, neon, uSynth);
      gl_FragColor = vec4(col * line, 1.0);
    }`,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
window.__kittPulse = (v) => { rimMat.uniforms.uPulse.value = Math.max(0, Math.min(1, v)); };

function loadCar(chain) {
  chain = chain.filter(Boolean);
  if (!chain.length) {
    statusEl.textContent = "modèle introuvable";
    window.kittToast?.("Modèle 3D introuvable", "aucun GLB chargeable dans hud/assets/");
    return;
  }
  new GLTFLoader().load(
    chain[0],
    (gltf) => {
      gltf.scene.updateMatrixWorld(true);
      if (!REAL) {
        gltf.scene.traverse((node) => {
          if (!node.isMesh) return;
          let geo = node.geometry.clone().applyMatrix4(node.matrixWorld);
          if (MODE === "edges") {
            carGroup.add(new THREE.Mesh(geo, hullMat));
            carGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, EDGE_THRESHOLD), edgeMat));
            return;
          }
          if (geo.index === null) geo = mergeVertices(geo, 1e-4);
          geo.computeVertexNormals();
          const hull = new THREE.Mesh(geo, hullMat);
          const rim  = new THREE.Mesh(geo, rimMat);
          rim.renderOrder = 1;
          carGroup.add(hull, rim);
        });
      } else {
        gltf.scene.traverse((node) => {
          if (!node.isMesh) return;
          let geo = node.geometry;
          if (geo.index === null) geo = mergeVertices(geo, 1e-4);
          geo.computeVertexNormals();
          node.geometry = geo;
          const src = node.material;
          node.material = new THREE.MeshPhysicalMaterial({
            map: src.map ?? null,
            color: src.color ?? new THREE.Color(0xffffff),
            roughness: 0.55, metalness: 0.12,
            clearcoat: 0.35, clearcoatRoughness: 0.3,
            envMapIntensity: 0.55,
            transparent: src.transparent, opacity: src.opacity ?? 1,
          });
        });
        carGroup.add(gltf.scene);
      }

      // Centre + met à l'échelle (longueur ~4 unités), pose sur le sol.
      const box = new THREE.Box3().setFromObject(carGroup);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const s = 4 / Math.max(size.x, size.z);
      carGroup.scale.setScalar(s);
      carGroup.position.sub(center.multiplyScalar(s));
      carGroup.position.y += (size.y * s) / 2;

      const scaled = new THREE.Box3().setFromObject(carGroup);
      rimMat.uniforms.uMinY.value = scaled.min.y;
      rimMat.uniforms.uMaxY.value = scaled.max.y;

      statusEl.textContent = "swipe ←→ : sections · swipe ↑ : kiTT · toucher : orienter";
      setTimeout(() => (statusEl.style.opacity = 0), 6000);
      window.__kitt = { scene, camera, controls, carGroup, renderer, composer, stepFlight };
    },
    undefined,
    () => loadCar(chain.slice(1))
  );
}
loadCar(modelChain);

// ---------- Boucle ----------
let prevT = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.1, (now - prevT) / 1000);
  prevT = now;
  stepFlight(dt);
  stepRoute(dt);
  controls.update();
  if (composer) composer.render();
  else renderer.render(scene, camera);
});

addEventListener("resize", () => {
  sizeCamera();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});
</script>

<script type="module">
// ============================================================
//  Environnement scrollé : sections, horloge, télémétrie OBD
// ============================================================
//  Pas de fenêtres : l'interface est une suite de SECTIONS superposées à
//  la scène 3D. Scroll (molette), swipe horizontal, ou dock → la caméra
//  vole vers la vue de la section et ses infos s'affichent en grand.
//  La télémétrie vient d'un simulateur de conduite (même forme de données
//  que python/obd.py) — à remplacer par un poll de /telemetry plus tard.

// ---------- Toasts : affichage élégant des erreurs (et infos) ----------
// kittToast(titre, détail, "error"|"info") — pile en haut à droite,
// auto-disparition, toucher pour fermer. Les erreurs script et promesses
// rejetées y atterrissent automatiquement : plus rien ne meurt en silence
// dans la console.
const toastsEl = document.getElementById("toasts");
window.kittToast = (title, detail = "", kind = "error") => {
  while (toastsEl.children.length >= 4) toastsEl.firstChild.remove();  // pas d'avalanche
  const t = document.createElement("div");
  t.className = "toast" + (kind === "info" ? " info" : "");
  t.innerHTML = `<span class="ic">${kind === "info" ? "◈" : "⚠"}</span>` +
                `<span><b>${title}</b>${detail ? `<small>${detail}</small>` : ""}</span>`;
  const close = () => { t.classList.add("out"); setTimeout(() => t.remove(), 450); };
  t.addEventListener("click", close);
  setTimeout(close, kind === "info" ? 5000 : 9000);
  toastsEl.appendChild(t);
};
addEventListener("error", (e) =>
  kittToast("Erreur script", `${e.message}<br>${(e.filename || "").split("/").pop()}:${e.lineno ?? "?"}`));
addEventListener("unhandledrejection", (e) =>
  kittToast("Erreur asynchrone", String(e.reason?.message ?? e.reason ?? "inconnue")));

// ---------- Horloge ----------
const clockEl = document.getElementById("clock");
function tickClock() {
  const d = new Date();
  clockEl.textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
tickClock();
setInterval(tickClock, 10_000);

// ---------- Sections ----------
const SECTIONS = ["car", "nav", "audio", "obd"];
let secIdx = 0;

function setSection(idx) {
  secIdx = (idx + SECTIONS.length) % SECTIONS.length;
  const name = SECTIONS[secIdx];
  document.querySelectorAll(".sec").forEach(s => s.classList.toggle("on", s.id === "sec-" + name));
  document.querySelectorAll("#dock button").forEach(b => b.classList.toggle("on", b.dataset.sec === name));
  document.querySelectorAll("#pager i").forEach((p, i) => p.classList.toggle("on", i === secIdx));
  window.__kittFly?.(name);
  window.__kittMap?.show(name === "nav");
}
for (const btn of document.querySelectorAll("#dock button"))
  btn.addEventListener("click", () => setSection(SECTIONS.indexOf(btn.dataset.sec)));

// Molette : section suivante/précédente (avec garde anti-rafale).
let wheelLock = 0;
addEventListener("wheel", (e) => {
  const now = performance.now();
  if (now < wheelLock || Math.abs(e.deltaY) < 10) return;
  wheelLock = now + 900;                 // le temps du vol de caméra
  setSection(secIdx + (e.deltaY > 0 ? 1 : -1));
}, { passive: true });

// Flèches clavier (pratique sur desktop) : ←/→ sections, ↑/↓ assistant.
addEventListener("keydown", (e) => {
  if (window.__kittAssistOpen?.() && e.key !== "ArrowDown" && e.key !== "Escape") return;
  if (e.key === "ArrowRight") setSection(secIdx + 1);
  if (e.key === "ArrowLeft")  setSection(secIdx - 1);
  if (e.key === "ArrowUp")    window.__kittOpenAssist?.();
  if (e.key === "ArrowDown")  window.__kittCloseAssist?.();
});

// Gestes : swipe horizontal = section, swipe vertical = assistant kiTT.
// (glisser lent = orbiter la voiture, géré par OrbitControls)
let touchStart = null;
addEventListener("pointerdown", (e) => { touchStart = { x: e.clientX, y: e.clientY, t: performance.now() }; });
addEventListener("pointerup", (e) => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
  const dt = performance.now() - touchStart.t;
  touchStart = null;
  if (dt > 350) return;                          // trop lent : c'était une orbite
  if (Math.abs(dy) > 90 && Math.abs(dy) > 2.5 * Math.abs(dx)) {
    if (dy < 0) window.__kittOpenAssist?.();     // vers le haut : kiTT monte
    else        window.__kittCloseAssist?.();    // vers le bas : il redescend
    return;
  }
  if (Math.abs(dx) > 80 && Math.abs(dx) > 2.5 * Math.abs(dy) && !window.__kittAssistOpen?.())
    setSection(secIdx + (dx < 0 ? 1 : -1));
});

// Clavier : flèche haut/bas = assistant (pratique au bureau), Échap = fermer.
addEventListener("keydown", (e) => {
  if (e.key === "Escape") window.__kittCloseAssist?.();
});

// ---------- Télémétrie : simulateur de conduite ----------
class SimTelemetry {
  constructor() {
    this.speed = 0;
    this.rpm = 850;
    this.coolant = 21;
    this.fuel = 62;
    this._phase = "accel";
    this._target = 90;
  }
  _rpmFor(speed) {
    if (speed < 1) return 850;
    const gears = [[20, 38], [40, 24], [65, 17], [95, 13], [130, 10], [999, 8.2]];
    for (const [maxKmh, ratio] of gears)
      if (speed <= maxKmh) return 850 + speed * ratio * 2.2;
    return 850;
  }
  step(dt) {
    if (this._phase === "accel") {
      this.speed += (14 + Math.random() * 6) * dt;
      if (this.speed >= this._target) this._phase = "cruise";
    } else if (this._phase === "cruise") {
      this.speed += (Math.random() - 0.5) * 4 * dt;
      if (Math.random() < 0.006) this._phase = Math.random() < 0.5 ? "decel" : "accel";
      if (this._phase === "accel") this._target = 60 + Math.random() * 70;
    } else {
      this.speed -= (18 + Math.random() * 10) * dt;
      if (this.speed <= 2) { this.speed = 0; this._phase = "idle"; this._idleT = 0; }
    }
    if (this._phase === "idle") {
      this._idleT += dt;
      if (this._idleT > 2 + Math.random() * 4) {
        this._phase = "accel";
        this._target = 40 + Math.random() * 90;
      }
    }
    this.speed = Math.max(0, Math.min(230, this.speed));
    const target = this._rpmFor(this.speed);
    this.rpm += (target - this.rpm) * Math.min(1, 6 * dt);
    this.coolant += (90 - this.coolant) * 0.008 * dt * 10;
    this.fuel = Math.max(0, this.fuel - 0.006 * dt * (0.4 + this.rpm / 4000));
    this.volt = (this.rpm < 1000 ? 13.6 : 14.2) + Math.sin(performance.now() / 900) * 0.06;
    const load = this._phase === "accel" ? (this.rpm - 1200) / 5000 : -0.25;
    this.boost = Math.max(-0.6, Math.min(1.2, (this.boost ?? 0) + (load - (this.boost ?? 0)) * 3 * dt));
  }
  snapshot() {
    return {
      speed: Math.round(this.speed),
      rpm: Math.round(this.rpm / 10) * 10,
      coolant_temp: Math.round(this.coolant),
      fuel: Math.round(this.fuel),
      volt: Math.round(this.volt * 10) / 10,
      boost: Math.round(this.boost * 100) / 100,
    };
  }
}

const sim = new SimTelemetry();
const speedHistory = [];
const REDLINE = 6500;
let last = performance.now();

// ---------- Éléments ----------
const el = (id) => document.getElementById(id);
const carSpeed = el("carSpeed"), carRpm = el("carRpm"), carRpmFill = el("carRpmFill");
const carTemp = el("carTemp"), carFuel = el("carFuel");
const obdRpm = el("obdRpm"), oTemp = el("oTemp"), oFuel = el("oFuel");
const oVolt = el("oVolt"), oBoost = el("oBoost"), obdAlert = el("obdAlert");
const spark = el("spark");

setInterval(() => {
  const now = performance.now();
  const dt = Math.min(0.5, (now - last) / 1000);
  last = now;
  sim.step(dt);
  const t = sim.snapshot();

  speedHistory.push(t.speed);
  if (speedHistory.length > 600) speedHistory.shift();

  // Section kiTT (dashboard).
  carSpeed.textContent = t.speed;
  carRpm.textContent = t.rpm.toLocaleString("fr-FR");
  carRpmFill.style.width = Math.min(100, (t.rpm / REDLINE) * 100) + "%";
  carTemp.textContent = t.coolant_temp + "°";
  carFuel.textContent = t.fuel + "%";
  const hotWarn = t.coolant_temp > 105, fuelWarn = t.fuel < 15;
  carTemp.classList.toggle("warn", hotWarn);
  carFuel.classList.toggle("warn", fuelWarn);

  // Section OBD.
  if (SECTIONS[secIdx] === "obd") {
    obdRpm.textContent = t.rpm.toLocaleString("fr-FR");
    oTemp.textContent = t.coolant_temp + " °C";
    oFuel.textContent = t.fuel + " %";
    oVolt.textContent = t.volt.toFixed(1) + " V";
    oBoost.textContent = (t.boost > 0 ? "+" : "") + t.boost.toFixed(2) + " bar";
    oTemp.parentElement.classList.toggle("warn", hotWarn);
    oFuel.parentElement.classList.toggle("warn", fuelWarn);
    const alerts = [];
    if (hotWarn)  alerts.push("⚠ SURCHAUFFE MOTEUR — " + t.coolant_temp + " °C");
    if (fuelWarn) alerts.push("⚠ CARBURANT BAS — " + t.fuel + " %");
    obdAlert.textContent = alerts.join("   ");

    const ctx = spark.getContext("2d");
    const w = spark.clientWidth, h = spark.clientHeight;
    if (spark.width !== w) { spark.width = w; spark.height = h; }
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#24e5ff";
    ctx.lineWidth = 1.5;
    ctx.shadowColor = "#24e5ff";
    ctx.shadowBlur = 6;
    ctx.beginPath();
    const n = speedHistory.length;
    for (let i = 0; i < n; i++) {
      const x = (i / Math.max(1, n - 1)) * w;
      const y = h - (speedHistory[i] / 230) * (h - 6) - 3;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  }

  navStep(t, dt);
}, 100);

{

// --- Recherche (Nominatim via le proxy /geocode) ---
let geoTimer = null;
function scheduleGeocode() {
  clearTimeout(geoTimer);
  if (navQ.value.trim().length < 3) { navResults.innerHTML = ""; return; }
  geoTimer = setTimeout(() => geocode(navQ.value), 700);
}
window.__kittGeocode = (q) => geocode(q, true);   // l'assistant route "va à X"
async function geocode(q, pickFirst = false) {
  q = q.trim();
  if (q.length < 3) return;
  try {
    // lat/lon : biais de proximité côté Nominatim (résultats près de la voiture).
    const res = await (await fetch("/geocode?" + new URLSearchParams({
      q, lat: carPos.lat, lon: carPos.lon }))).json();
    if (res.error) throw new Error(res.error);
    navResults.innerHTML = "";
    if (pickFirst) {
      if (!res.length) return null;
      return await setDestination(res[0]);
    }
    for (const hit of res) {
      const b = document.createElement("button");
      const parts = hit.display_name.split(",");
      b.innerHTML = `${parts[0]}<small>${parts.slice(1, 4).join(",").trim()}</small>`;
      b.addEventListener("click", () => setDestination(hit));
      navResults.appendChild(b);
    }
  } catch (e) {
    kittToast("Recherche indisponible", e.message);
    navResults.innerHTML = "";
  }
}

// --- Itinéraire (OSRM via le proxy /route) ---
async function setDestination(hit) {
  if (kbdTarget?.input === navQ) hideKbd();
  navResults.innerHTML = "";
  navQ.value = hit.display_name.split(",")[0];
  navBanner.textContent = "calcul de l'itinéraire…";
  try {
    const res = await (await fetch("/route?" + new URLSearchParams({
      flat: carPos.lat, flon: carPos.lon, tlat: hit.lat, tlon: hit.lon }))).json();
    const route = res.routes?.[0];
    if (!route) throw new Error(res.error || res.code || "pas de route");
    window.__kittMap.setRoute(route.geometry.coordinates);
    navDist = route.distance / 1000;
    navStreet = navQ.value;
    return { km: navDist, min: Math.round(route.duration / 60), name: navStreet };
  } catch (e) {
    kittToast("Itinéraire indisponible", e.message);
    navBanner.textContent = "Où va-t-on ?";
    navStreet = null;
  }
}

function navStep(t, dt) {
  if (navStreet) navDist = Math.max(0, navDist - (t.speed * dt) / 3600);
  if (SECTIONS[secIdx] !== "nav" || !navStreet) return;
  const arrived = navDist <= 0.005;
  navBanner.textContent = arrived
    ? "🏁 Vous êtes arrivé"
    : `➤ ${navStreet}`;
  const etaMin = t.speed > 3 ? (navDist / t.speed) * 60 : navDist * 1.2;
  navEta.innerHTML = arrived
    ? "Destination atteinte"
    : `<b>${navDist < 10 ? navDist.toFixed(1) : Math.round(navDist)} km</b> &nbsp;·&nbsp; ${Math.max(1, Math.round(etaMin))} min &nbsp;·&nbsp; arrivée ${
        new Date(Date.now() + etaMin * 60000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`;
}

// ============================================================
//  Assistant kiTT — swipe vers le haut
// ============================================================
//  Reprend la logique déjà écrite côté MPU :
//    - voice.py    : machine à états VEILLE -> ECOUTE -> REFLEXION -> PAROLE
//    - intents.py  : reconnaissance par mots-clés, insensible aux accents
//  Ici c'est la COUCHE HUD : l'orbe reprend les états (comme la matrice LED
//  13x8 le fait dans la voiture) et la carrosserie PULSE quand kiTT parle.
//  Le micro utilise la Web Speech API si dispo ; sinon le clavier tactile.

const assist = el("assist"), assistQ = el("assistQ"), assistMic = el("assistMic");
const assistReply = el("assistReply"), assistUser = el("assistUser");
const orb = el("orb"), orbCtx = orb.getContext("2d");
let assistOpen = false;
let vState = "idle";                    // idle | listen | think | speak
let vLevel = 0;                         // 0..1 : amplitude (micro ou TTS)
let speakUntil = 0;

function openAssist() {
  if (assistOpen) return;
  assistOpen = true;
  assist.classList.add("on");
  window.__kittFly?.("assistant");
  setVState("idle");
}
function closeAssist() {
  if (!assistOpen) return;
  assistOpen = false;
  assist.classList.remove("on");
  if (kbdTarget?.input === assistQ) window.__kittHideKbd();
  stopRec();
  setVState("idle");
  window.__kittFly?.(SECTIONS[secIdx]);   // retour à la vue de la section courante
}
window.__kittAssistOpen = () => assistOpen;
window.__kittCloseAssist = closeAssist;
window.__kittOpenAssist = openAssist;

function setVState(s) {
  vState = s;
  if (s !== "speak") window.__kittPulse?.(0);
}

// --- Orbe : le "visage" de kiTT, un anneau qui réagit à l'état ---
// (même vocabulaire que les animations de la matrice LED : veille douce,
//  écoute qui suit le niveau, réflexion qui tourne, parole qui pulse)
function drawOrb(t) {
  const w = orb.width, h = orb.height, cx = w / 2, cy = h / 2;
  orbCtx.clearRect(0, 0, w, h);
  const base = 34;
  const amp = vState === "listen" ? vLevel * 16
            : vState === "speak"  ? vLevel * 20 : 0;

  // Anneau principal, déformé par l'amplitude.
  orbCtx.lineWidth = 2.5;
  orbCtx.strokeStyle = vState === "speak" ? "#ff2d95" : "#24e5ff";
  orbCtx.shadowColor = orbCtx.strokeStyle;
  orbCtx.shadowBlur = 14 + amp;
  orbCtx.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = (i / 72) * Math.PI * 2;
    const wobble = vState === "idle" ? Math.sin(a * 3 + t * 1.2) * 1.6
                                     : Math.sin(a * 5 + t * 7) * amp * 0.5;
    const r = base + amp * 0.5 + wobble;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? orbCtx.lineTo(x, y) : orbCtx.moveTo(x, y);
  }
  orbCtx.closePath();
  orbCtx.stroke();

  // Arc de réflexion qui tourne.
  if (vState === "think") {
    orbCtx.beginPath();
    orbCtx.arc(cx, cy, base + 12, t * 3, t * 3 + 1.1);
    orbCtx.stroke();
  }
  orbCtx.shadowBlur = 0;
}

// --- Reconnaissance d'intentions (portage de python/intents.py) ---
const strip = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const has = (s, ...words) => words.some(w => s.includes(w));

async function route(text) {
  const s = strip(text);

  // Navigation : "va à X", "emmène-moi à X", "itinéraire vers X"
  const m = s.match(/(?:va (?:a|au|vers)|emmene[- ]moi (?:a|au|vers)|itineraire (?:vers|pour)|direction|conduis[- ]moi (?:a|au|vers))\s+(.{2,})/);
  if (m) {
    const dest = m[1].trim();
    setSection(SECTIONS.indexOf("nav"));
    const r = await window.__kittGeocode(dest);
    return r
      ? `C'est parti pour ${r.name} — ${r.km < 10 ? r.km.toFixed(1) : Math.round(r.km)} kilomètres, environ ${r.min} minutes.`
      : `Je ne trouve pas « ${dest} ».`;
  }

  // Télémétrie : l'assistant lit le simulateur (plus tard : le vrai OBD)
  const t = sim.snapshot();
  if (has(s, "vitesse", "vite", "roule"))
    return `Tu roules à ${t.speed} kilomètres-heure.`;
  if (has(s, "regime", "tour", "rpm"))
    return `Le moteur tourne à ${t.rpm.toLocaleString("fr-FR")} tours par minute.`;
  if (has(s, "temperature", "chauffe", "eau", "moteur"))
    return `La température moteur est de ${t.coolant_temp} degrés.` +
           (t.coolant_temp > 105 ? " Attention, c'est trop chaud." : " Tout va bien.");
  if (has(s, "essence", "carburant", "reservoir", "autonomie"))
    return `Il reste ${t.fuel} pour cent de carburant, soit environ ${Math.round(t.fuel * 0.55 * 12)} kilomètres.`;
  if (has(s, "batterie", "tension", "volt"))
    return `La batterie est à ${t.volt.toFixed(1)} volts.`;
  if (has(s, "turbo", "pression", "boost"))
    return `Pression turbo : ${t.boost > 0 ? "+" : ""}${t.boost.toFixed(2)} bar.`;
  if (has(s, "diagnostic", "obd", "etat de la voiture", "bilan")) {
    setSection(SECTIONS.indexOf("obd"));
    return `Diagnostic : ${t.speed} kilomètres-heure, ${t.rpm} tours, ${t.coolant_temp} degrés, ${t.fuel} pour cent de carburant.`;
  }

  // Écrans
  if (has(s, "navigation", "carte", "gps")) { setSection(SECTIONS.indexOf("nav")); return "Voici la carte."; }
  if (has(s, "musique", "audio", "morceau", "chanson")) {
    setSection(SECTIONS.indexOf("audio"));
    return `On écoute ${TRACKS[trackIdx].t}, de ${TRACKS[trackIdx].a}.`;
  }
  if (has(s, "tableau de bord", "accueil", "veille")) { setSection(0); return "Retour au tableau de bord."; }

  // Média
  if (has(s, "joue", "lance la musique", "play")) { playing = true; syncPlayUI(); return "Je lance la musique."; }
  if (has(s, "pause", "stop", "arrete", "silence")) { playing = false; syncPlayUI(); return "Musique en pause."; }
  if (has(s, "suivant", "prochaine", "next")) { loadTrack(trackIdx + 1); playing = true; syncPlayUI(); return `Titre suivant : ${TRACKS[trackIdx].t}.`; }
  if (has(s, "precedent", "avant", "previous")) { loadTrack(trackIdx - 1); playing = true; syncPlayUI(); return `Titre précédent : ${TRACKS[trackIdx].t}.`; }

  // Divers
  if (has(s, "heure", "quelle heure"))
    return `Il est ${new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}.`;
  if (has(s, "bonjour", "salut", "hello", "coucou"))
    return "Bonjour. Où allons-nous ?";
  if (has(s, "merci")) return "Avec plaisir.";
  if (has(s, "qui es[- ]tu", "qui es tu", "presente"))
    return "Je suis kiTT, l'intelligence embarquée de ta TT.";

  // Rien de reconnu : côté MPU, c'est ici que le LLM prendrait la main (#6).
  return "Je n'ai pas compris. Essaie : « va à la tour Eiffel », « quelle est ma vitesse », « joue de la musique ».";
}

// --- Cycle de conversation : écoute -> réflexion -> parole ---
async function converse(text) {
  if (!text.trim()) return;
  assistUser.textContent = "« " + text + " »";
  assistReply.textContent = "";
  setVState("think");
  const reply = await route(text);
  assistReply.textContent = reply;
  speak(reply);
}

// --- Synthèse vocale (Web Speech API si dispo) ---
function speak(text) {
  setVState("speak");
  // Durée de repli si pas de TTS : ~14 caractères/seconde.
  speakUntil = performance.now() + Math.max(1600, text.length * 70);
  const synth = window.speechSynthesis;
  if (!synth) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = 1.05; u.pitch = 0.85;
    u.onend = () => { speakUntil = 0; setVState("idle"); };
    synth.speak(u);
  } catch { /* pas de voix installée : on garde le repli temporel */ }
}

// --- Micro (Web Speech API) ---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function startRec() {
  if (!SR) {
    kittToast("Micro indisponible", "ce navigateur ne gère pas la reconnaissance vocale — utilise le clavier", "info");
    return;
  }
  rec = new SR();
  rec.lang = "fr-FR"; rec.interimResults = true; rec.continuous = false;
  setVState("listen");
  assistMic.classList.add("rec");
  rec.onresult = (e) => {
    const r = e.results[e.results.length - 1];
    assistQ.value = r[0].transcript;
    vLevel = 0.35 + Math.random() * 0.5;      // pas d'accès direct au niveau : on l'anime
    if (r.isFinal) { stopRec(); converse(r[0].transcript); }
  };
  rec.onerror = (e) => { stopRec(); kittToast("Micro", e.error); };
  rec.onend = () => stopRec();
  try { rec.start(); } catch { stopRec(); }
}
function stopRec() {
  assistMic.classList.remove("rec");
  if (vState === "listen") setVState("idle");
  if (rec) { try { rec.stop(); } catch {} rec = null; }
}
assistMic.addEventListener("click", () => rec ? stopRec() : startRec());
assistQ.addEventListener("click", () => showKbd({
  input: assistQ,
  onEnter: (v) => { converse(v); assistQ.value = ""; },
}));

// --- Boucle d'animation de l'orbe + pulsation de la carrosserie ---
(function orbLoop() {
  const t = performance.now() / 1000;
  if (vState === "speak") {
    // Enveloppe de parole : porteuse + syllabes (comme _envelope() de main.py).
    const carrier = 0.5 * (1 + Math.sin(t * 6.5));
    const syll = 0.5 * (1 + Math.sin(t * 17));
    vLevel = 0.35 + 0.65 * (0.55 * carrier + 0.45 * carrier * syll);
    window.__kittPulse?.(vLevel * 0.9);
    if (speakUntil && performance.now() > speakUntil) { speakUntil = 0; setVState("idle"); }
  } else if (vState === "think") {
    vLevel = 0.25;
  } else if (vState !== "listen") {
    vLevel *= 0.9;
  }
  if (assistOpen) drawOrb(t);
  requestAnimationFrame(orbLoop);
})();
</script>
